name: Windows build

on:
  push:
    branches: [main, release/v1.0.0, 'release/v1.1.0-beta.*', 'release/v1.2.0-beta.*']
    tags: ['v1.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate WPF markup and event references
        run: python tests/static_check.py
      - name: Validate local acceptance PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path tests/windows_local_acceptance.ps1),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Run cross-platform core checks
        run: dotnet run --project tests/Sidelane.CoreTests/Sidelane.CoreTests.csproj -c Release
      - name: Restore Windows project
        run: dotnet restore src/Sidelane/Sidelane.csproj
      - name: Build Windows project (warnings are errors)
        run: dotnet build src/Sidelane/Sidelane.csproj -c Release --no-restore -warnaserror
      - name: Publish self-contained portable Windows binary
        run: dotnet publish src/Sidelane/Sidelane.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - name: Publish native browser host
        shell: pwsh
        run: |
          dotnet publish src/Sidelane.NativeHost/Sidelane.NativeHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o native-out
          Copy-Item native-out/Sidelane.NativeHost.exe out/Sidelane.NativeHost.exe
          if (!(Test-Path out/Sidelane.NativeHost.exe)) { throw 'Native host publish failed' }
      - name: Validate optional Chrome companion files
        shell: pwsh
        run: |
          node --check companion/chrome/observer.js
          node --check companion/chrome/worker.js
          $manifest = Get-Content -Raw companion/chrome/manifest.json | ConvertFrom-Json
          if ($manifest.manifest_version -ne 3) { throw "Expected a Chrome MV3 extension" }
          foreach ($file in @("companion/Register-Bridge.ps1", "companion/Remove-Bridge.ps1", "tests/native_host_smoke.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Native host message framing smoke test
        shell: pwsh
        run: ./tests/native_host_smoke.ps1
      - name: Native Windows process launch smoke test
        shell: pwsh
        run: ./tests/windows_launch_smoke.ps1 -ExePath out/Sidelane.exe
      - name: Capture WPF desktop preview (best effort, not release gate)
        continue-on-error: true
        shell: pwsh
        run: ./tests/windows_capture_preview.ps1 -ExePath out/Sidelane.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sidelane-native-wpf-preview
          path: qa-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Package Windows artifact
        shell: pwsh
        run: |
          Copy-Item README-START.txt out/README-START.txt
          Copy-Item LICENSE out/LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md out/THIRD_PARTY_NOTICES.md
          Copy-Item companion out/companion -Recurse -Force
          Compress-Archive -Path out/* -DestinationPath Sidelane-win-x64.zip
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$iscc) {
            choco install innosetup --yes --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found.' }
          & $iscc installer/Sidelane.iss
          if ($LASTEXITCODE -ne 0 -or !(Test-Path dist/SidelaneSetup.exe)) { throw 'Installer compilation failed.' }
      - name: Verify silent install and uninstall
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Sidelane-QA-Install"
          $p = Start-Process dist/SidelaneSetup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=$dir" -PassThru -Wait
          if ($p.ExitCode -ne 0 -or !(Test-Path (Join-Path $dir "Sidelane.exe"))) { throw 'Installer smoke failed.' }
          $uninstall = Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstaller failed.' }
          if (Test-Path (Join-Path $dir "Sidelane.exe")) { throw 'Executable not removed.' }
      - name: Verify packaged Windows executable
        shell: pwsh
        run: |
          if (!(Test-Path out/Sidelane.exe)) { throw 'Publish did not produce Sidelane.exe' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path Sidelane-win-x64.zip))
          try {
            if (!($zip.Entries | Where-Object FullName -eq 'Sidelane.exe')) {
              throw 'The packaged archive is missing Sidelane.exe'
            }
          } finally { $zip.Dispose() }
      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash Sidelane-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Sidelane-win-x64.zip" | Set-Content Sidelane-win-x64.sha256 -Encoding ascii
          $installerHash = (Get-FileHash dist/SidelaneSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Copy-Item dist/SidelaneSetup.exe SidelaneSetup.exe
          "$installerHash  SidelaneSetup.exe" | Set-Content SidelaneSetup.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Sidelane-win-x64
          path: |
            Sidelane-win-x64.zip
            Sidelane-win-x64.sha256
            SidelaneSetup.exe
            SidelaneSetup.sha256
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sidelane-win-x64
      - name: Create release for an explicitly pushed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" Sidelane-win-x64.zip Sidelane-win-x64.sha256 SidelaneSetup.exe SidelaneSetup.sha256 \
            --repo "${GITHUB_REPOSITORY}" --title "Sidelane ${GITHUB_REF_NAME}" --generate-notes --verify-tag "${flags[@]}"
