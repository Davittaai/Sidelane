name: Publish preview after verified Windows build

# Deliberately selected preview branch, never a pull request or untrusted fork.
on:
  workflow_run:
    workflows: ["Windows build"]
    types: [completed]
    branches: ["release/v1.1.0-beta.*", "release/v1.2.0-beta.*", "release/v1.3.0-beta.*"]

permissions:
  contents: write
  actions: read

jobs:
  release-preview:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && (startsWith(github.event.workflow_run.head_branch, 'release/v1.1.0-beta.') || startsWith(github.event.workflow_run.head_branch, 'release/v1.2.0-beta.') || startsWith(github.event.workflow_run.head_branch, 'release/v1.3.0-beta.')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the release commit is selected branch head
        id: selected
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          [[ "$HEAD_BRANCH" =~ ^release/v1\.(1|2|3)\.0-beta\.[0-9]+$ ]] || exit 1
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$HEAD_BRANCH" --jq .object.sha)
          if [ "$current" = "$HEAD_SHA" ]; then
            echo 'yes=true' >> "$GITHUB_OUTPUT"
          else
            echo "Stale build $HEAD_SHA; selected release head $current"
            echo 'yes=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Download verified Windows artifact
        if: steps.selected.outputs.yes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name Sidelane-win-x64 --dir dist
      - name: Check checksum and executable
        if: steps.selected.outputs.yes == 'true'
        run: |
          cd dist
          sha256sum --check Sidelane-win-x64.sha256
          sha256sum --check SidelaneSetup.sha256
          unzip -l Sidelane-win-x64.zip | grep -E 'Sidelane.exe|LICENSE|README-START.txt'
      - name: Publish preview assets
        if: steps.selected.outputs.yes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          TAG="${HEAD_BRANCH#release/}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Sidelane-win-x64.zip dist/Sidelane-win-x64.sha256 dist/SidelaneSetup.exe dist/SidelaneSetup.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/Sidelane-win-x64.zip dist/Sidelane-win-x64.sha256 dist/SidelaneSetup.exe dist/SidelaneSetup.sha256 \
              --prerelease --target "$HEAD_SHA" --title "Sidelane $TAG" \
              --notes-file docs/RELEASE-NOTES-v1.2-beta.md --repo "$GITHUB_REPOSITORY"
          fi
